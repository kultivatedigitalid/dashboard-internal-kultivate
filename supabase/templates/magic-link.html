<!doctype html>
<html lang="id">
  <body style="margin:0;background:#f5f6f1;font-family:Arial,sans-serif;color:#24291f">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #dfe3d7;border-radius:16px;padding:32px">
          <tr><td>
            <p style="margin:0 0 8px;color:#647052;font-size:13px;font-weight:700">KULTIVATE DIGITAL ID</p>
            <h1 style="margin:0 0 16px;font-size:26px">Konfirmasi login pertama Anda</h1>
            <p style="margin:0 0 24px;line-height:1.6;color:#62695b">Masukkan kode berikut pada halaman verifikasi untuk menyelesaikan login. Jangan berikan kode ini kepada siapa pun.</p>
            <p style="margin:0 0 24px;padding:18px;background:#f1f4eb;border-radius:12px;text-align:center;font-size:34px;font-weight:800;letter-spacing:8px">{{ .Token }}</p>
            <p style="margin:0;line-height:1.6;color:#62695b">Kode berlaku selama 10 menit. Jika Anda tidak mencoba login, abaikan email ini dan hubungi administrator.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
